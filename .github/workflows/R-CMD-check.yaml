# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::BH
            any::RcppEigen
          needs: check

      # rstan 2.32.7 on CRAN appends -std=c++1y to every Stan compile on
      # Windows, but StanHeaders >= 2.39 needs C++17 (stan-dev/rstan#1197).
      # CXX17FLAGS comes after that flag on the compiler line, so this puts
      # C++17 back. Remove once CRAN has an rstan release without -std=c++1y.
      - name: Compile Stan models as C++17 on Windows
        if: runner.os == 'Windows'
        shell: Rscript {0}
        run: |
          makevars <- file.path(Sys.getenv("RUNNER_TEMP"), "Makevars.win")
          writeLines("CXX17FLAGS += -std=gnu++17", makevars)
          cat("R_MAKEVARS_USER=", normalizePath(makevars, "/"), "\n",
              sep = "", file = Sys.getenv("GITHUB_ENV"), append = TRUE)

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
