on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

name: pkgdown

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2
        if: github.event.action != 'closed'

      - uses: r-lib/actions/setup-r@v2
        if: github.event.action != 'closed'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: github.event.action != 'closed'
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Create _pkgdown.yml
        if: github.event.action != 'closed'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            printf 'url: %s/pr/%s\ntemplate:\n  bootstrap: 5\n' "$SITE_URL" "$PR_NUMBER" > _pkgdown.yml
          else
            printf 'url: %s\ntemplate:\n  bootstrap: 5\n' "$SITE_URL" > _pkgdown.yml
          fi

      - name: Build site (main branch)
        if: github.event_name != 'pull_request'
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Build site (PR branch)
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

      - name: Deploy PR preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
          target-folder: pr/${{ github.event.pull_request.number }}

      - name: Comment PR
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            // Branch names are contributor-controlled, so nothing about the
            // branch may be interpolated into this script or the shell steps.
            // The branch is read from the event payload at runtime and the
            // preview location is derived from the numeric PR id only.
            const prNumber = context.payload.pull_request?.number ?? context.issue.number;
            const branch = context.payload.pull_request?.head?.ref;
            const url = `https://sims1253.github.io/bayesfam/pr/${prNumber}`;
            let body = `Documentation preview for this PR is available at: ${url}`;
            if (branch) {
              body += ` (built from branch "${branch}")`;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Clean up PR preview 🗑️
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          GH_PAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --single-branch --branch gh-pages "https://x-access-token:${GH_PAGES_TOKEN}@github.com/${REPOSITORY}.git" gh-pages-repo
          cd gh-pages-repo
          preview_dir="pr/${PR_NUMBER}"
          if [ -d "${preview_dir}" ]; then
            rm -rf "${preview_dir}"
            echo "Removed documentation for closed PR: ${PR_NUMBER}"
            git add .
            git commit -m "Remove documentation for closed PR: ${PR_NUMBER}" || exit 0
            git push
          else
            echo "No documentation found for PR: ${PR_NUMBER}"
          fi
